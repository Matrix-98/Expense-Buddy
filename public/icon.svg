<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Main Wallet Body -->
  <g filter="url(#glow)">
    <rect x="120" y="150" width="272" height="212" rx="28" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="6" />
    <!-- Top flap -->
    <path d="M 120 200 L 256 250 L 392 200" fill="none" stroke="#334155" stroke-width="4" />
    <!-- Wallet Card insert -->
    <rect x="150" y="125" width="212" height="45" rx="12" fill="url(#glowGrad)" opacity="0.9" />
    <!-- Wallet Flap & Clasp -->
    <path d="M 280 220 L 392 220 L 392 290 L 280 290 A 35 35 0 0 1 280 220 Z" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="5" />
    <circle cx="310" cy="255" r="14" fill="url(#accentGrad)" />
  </g>

  <!-- Currency / Upward Growth symbol inside clasp / overlay -->
  <path d="M 205 290 L 225 240 L 245 270 L 275 210" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="260,210 275,210 275,225" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
