<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Teal Wallet Body Gradient -->
    <linearGradient id="walletGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38D7D2" />
      <stop offset="45%" stop-color="#22B8B4" />
      <stop offset="100%" stop-color="#12898B" />
    </linearGradient>

    <!-- Top Fold Inner Shade -->
    <linearGradient id="innerFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F727A" />
      <stop offset="100%" stop-color="#0B555C" />
    </linearGradient>

    <!-- Orange Cash Bill Gradient -->
    <linearGradient id="orangeBillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Green Cash Bill Gradient -->
    <linearGradient id="greenBillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Gold Coin Outer Gradient -->
    <linearGradient id="coinOuterGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gold Coin Inner Face -->
    <linearGradient id="coinInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Clasp Tab Gradient -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Growth Arrow Green Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <g id="expense-buddy-mascot">
    <!-- 1. Little Stubby Feet -->
    <path
      d="M 195 405 L 195 440 C 195 458 225 458 225 440 L 225 405 Z"
      fill="#13384A"
    />
    <path
      d="M 275 405 L 275 440 C 275 458 305 458 305 440 L 305 405 Z"
      fill="#13384A"
    />

    <!-- 2. Arms (Under layers) -->
    <!-- Right Arm loop -->
    <path
      d="M 370 310 C 415 315 425 390 380 400 C 370 402 360 395 365 385 C 395 380 395 330 365 325 Z"
      fill="#13384A"
    />

    <!-- Left Arm loop holding coin -->
    <path
      d="M 135 285 C 80 300 70 385 130 405 C 145 410 155 400 148 388 C 105 375 105 320 142 305 Z"
      fill="#13384A"
    />

    <!-- 3. Back Wallet Rim & Top Fold -->
    <path
      d="M 145 155 C 145 130 165 110 190 108 L 340 108 C 365 110 385 130 385 155 L 385 200 L 145 200 Z"
      fill="url(#innerFoldGrad)"
      stroke="#13384A"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- 4. Cash Bills Peeking Out from Top -->
    <!-- Green Bill (Back) -->
    <g transform="rotate(-7, 240, 140)">
      <rect
        x="170"
        y="85"
        width="155"
        height="90"
        rx="16"
        fill="url(#greenBillGrad)"
        stroke="#13384A"
        stroke-width="12"
        stroke-linejoin="round"
      />
      <circle cx="245" cy="125" r="16" fill="#10B981" opacity="0.6" />
    </g>

    <!-- Orange / Yellow Bill (Front) -->
    <g transform="rotate(5, 270, 145)">
      <rect
        x="210"
        y="105"
        width="145"
        height="85"
        rx="16"
        fill="url(#orangeBillGrad)"
        stroke="#13384A"
        stroke-width="12"
        stroke-linejoin="round"
      />
      <circle cx="280" cy="140" r="14" fill="#D97706" opacity="0.5" />
    </g>

    <!-- 5. Main Front Wallet Flap -->
    <rect
      x="135"
      y="160"
      width="240"
      height="225"
      rx="38"
      fill="url(#walletGrad)"
      stroke="#13384A"
      stroke-width="15"
      stroke-linejoin="round"
    />

    <!-- Subtle Top-Left Edge Highlight on Flap -->
    <path
      d="M 148 230 L 148 198 C 148 178 165 172 188 172 L 280 172"
      fill="none"
      stroke="#A7F3D0"
      stroke-width="6"
      stroke-linecap="round"
      opacity="0.55"
    />

    <!-- 6. Cute Face: Eyes & Smile -->
    <!-- Left Eye (Happy Inverted Arc) -->
    <path
      d="M 200 248 C 205 230 230 230 235 248"
      fill="none"
      stroke="#13384A"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right Eye (Happy Inverted Arc) -->
    <path
      d="M 275 248 C 280 230 305 230 310 248"
      fill="none"
      stroke="#13384A"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Friendly Smile -->
    <path
      d="M 230 286 C 242 308 268 308 280 286"
      fill="none"
      stroke="#13384A"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 7. Green Financial Growth Arrow Chart on Wallet Face -->
    <g>
      <!-- Arrow Line Body with Thick Outline -->
      <path
        d="M 226 384 L 254 336 L 278 368 L 324 308"
        fill="none"
        stroke="#13384A"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 226 384 L 254 336 L 278 368 L 324 308"
        fill="none"
        stroke="url(#arrowGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Arrowhead Polygon -->
      <path
        d="M 300 294 L 340 304 L 330 344 Z"
        fill="url(#arrowGrad)"
        stroke="#13384A"
        stroke-width="11"
        stroke-linejoin="round"
      />
    </g>

    <!-- 8. Right Clasp / Strap Tab -->
    <g>
      <rect
        x="345"
        y="245"
        width="62"
        height="56"
        rx="26"
        fill="url(#claspGrad)"
        stroke="#13384A"
        stroke-width="14"
        stroke-linejoin="round"
      />
      <!-- Clasp Snap Button -->
      <circle cx="374" cy="273" r="10" fill="#13384A" />
      <circle cx="374" cy="273" r="4" fill="#D97706" />
    </g>

    <!-- 9. Big Shiny Gold Coin with Dollar Sign (Front Left) -->
    <g id="gold-dollar-coin">
      <!-- Coin Base with Thick Outline -->
      <circle
        cx="175"
        cy="365"
        r="54"
        fill="url(#coinOuterGrad)"
        stroke="#13384A"
        stroke-width="14"
      />

      <!-- Inner Coin Ridge -->
      <circle
        cx="175"
        cy="365"
        r="42"
        fill="url(#coinInnerGrad)"
        stroke="#F59E0B"
        stroke-width="4"
      />

      <!-- Coin Highlight Arc -->
      <path
        d="M 145 340 C 155 326 185 324 202 334"
        fill="none"
        stroke="#FFF"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.65"
      />

      <!-- Crisp Dollar Sign ($) -->
      <text
        x="175"
        y="383"
        font-family="'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="48"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        stroke="#D97706"
        stroke-width="2"
      >$</text>
    </g>
  </g>
</svg>
